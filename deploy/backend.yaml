# Named "app" with selector app=app to match the platform's starter app, which
# Argo CD takes over in place (a Deployment's selector is immutable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
    app.kubernetes.io/name: conference-assistant-api
spec:
  # Conversation state is in memory: keep exactly one replica.
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.kubernetes.io/name: conference-assistant-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: conference-assistant-api
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8787"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conference-assistant-api
                  key: OPENAI_API_KEY
                  optional: true
            # Required on purpose: without a pairing token the pod won't start
            # (CreateContainerConfigError) instead of serving the public URL unauthenticated.
            - name: APP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: conference-assistant-api
                  key: APP_ACCESS_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
# The hackathon platform routes https://daniel-cluff.cnh.radarhq.io to
# Service "app", port 80, in namespace team-daniel-cluff. Keep this name/port.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: http
