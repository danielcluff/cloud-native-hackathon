# Build + push the backend image to GHCR on every push to main that touches it,
# then commit the new tag into deploy/kustomization.yaml so Argo CD rolls it out.
# Same flow as the Radar hackathon starter (skyhook-io/cnh-starter).
name: backend-image

on:
  push:
    branches: [main]
    paths:
      - server/**
      - shared/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/backend-image.yml
  workflow_dispatch:

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/conference-assistant-api

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch: the dev-local cluster may be arm64 (Apple silicon) or amd64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main

  deploy-commit:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point kustomize at the new image tag
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          # Quote the tag: an all-digit SHA prefix (e.g. 9636345) would otherwise be a
          # YAML number, and kustomize rejects non-string image tags.
          sed -i -E "s/^(\s*newTag:).*/\1 \"${TAG}\"/" deploy/kustomization.yaml
          git diff --stat
          if git diff --quiet; then echo "tag unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: conference-assistant-api ${TAG}"
          git push
